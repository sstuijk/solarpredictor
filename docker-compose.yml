services:
  solarpredictor:
    #image: ghcr.io/sstuijk/solarpredictor:main
    build: .
    container_name: solarpredictor
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - LATITUDE=${SOLARPREDICTOR_LATITUDE}
      - LONGITUDE=${SOLARPREDICTOR_LONGITUDE}
      - TIMEZONE=${SOLARPREDICTOR_TIMEZONE}
      - PANEL_CAPACITY_KWP=${SOLARPREDICTOR_PANEL_CAPCACITY}
      - HA_URL=${SOLARPREDICTOR_HA_URL}
      - HA_TOKEN=${SOLARPREDICTOR_HA_TOKEN}
      - HA_ENTITY_ID=${SOLARPREDICTOR_HA_ENTITY}
      - HA_ENERGY_UNIT=kWh
      - HA_FEED_MODE=cumulative_energy
      - DATA_DIR=/app/data
      - MODEL_DIR=/app/models
      - MODEL_PATH=/app/models/lightgbm_model.joblib
      - METRICS_PATH=/app/models/metrics.json
      - MAX_FORECAST_DAYS=7
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./models:/app/models

